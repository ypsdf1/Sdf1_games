name: 功能新增
description: 提出一个新功能的需求建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 请描述你希望添加的新功能。
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 为什么需要这个功能？它能解决什么问题？
  - type: textarea
    id: implementation
    attributes:
      label: 建议的实现方式
      description: 如果对实现方式有想法，请在此描述。
  - type: textarea
    id: additional
    attributes:
      label: 额外信息
