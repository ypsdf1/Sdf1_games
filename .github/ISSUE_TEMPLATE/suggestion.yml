name: 建议提交
description: 对插件提出改进建议或反馈
title: "[Suggestion] "
labels: ["suggestion"]
body:
  - type: textarea
    id: content
    attributes:
      label: 建议内容
      description: 请描述你的建议或想法。
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 什么场景下产生的这个建议？
  - type: textarea
    id: effect
    attributes:
      label: 预期效果
      description: 你认为采用这个建议后能达到什么效果？
