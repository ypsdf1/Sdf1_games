name: Bug 反馈
description: 报告一个 Bug 以帮助改进插件
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 请简明扼要地描述 Bug 是什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: |
        1. 进入 ...
        2. 点击 ...
        3. 出现错误 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述你期望发生的事情。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生了什么。
    validations:
      required: true
  - type: input
    id: server_version
    attributes:
      label: 服务器类型和版本
      placeholder: 如 Paper 1.21.4
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
  - type: textarea
    id: logs
    attributes:
      label: 截图 / 日志
      description: 如有相关截图或报错日志，请粘贴在此处。
  - type: textarea
    id: additional
    attributes:
      label: 其他信息
